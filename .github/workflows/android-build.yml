name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inspect project root
        run: |
          echo "Root files:" ; ls -la
          echo "Has gradlew:" ; test -f gradlew && echo YES || echo NO
          echo "Has gradle-wrapper.jar:" ; test -f gradle/wrapper/gradle-wrapper.jar && echo YES || echo NO

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Bundle Release AAB
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Locate artifacts
        run: |
          ls -la app/build/outputs/apk/debug/ 2>&1 || true
          ls -la app/build/outputs/bundle/release/ 2>&1 || true

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reading-quiz-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reading-quiz-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          echo "### Build finished" >> $GITHUB_STEP_SUMMARY
          echo "See artifacts on the Actions run page." >> $GITHUB_STEP_SUMMARY
